root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  bin = "tmp/api"
  full_bin = "./tmp/api"
  include_ext = ["go"]
  exclude_dir = ["tmp", "data"]
  exclude_regex = ["_test.go"]
  delay = 300
  # Docker Desktop's Windows bind mount doesn't reliably propagate inotify
  # events into the container, so file-watching falls back to polling.
  poll = true
  poll_interval = 500

[log]
  time = true

[misc]
  clean_on_exit = true
