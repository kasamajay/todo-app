services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - ./api:/app
      - ./api/data:/app/data
    working_dir: /app
    environment:
      - ADDR=:8080
      - DATA_DIR=/app/data
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:5173/api/auth/google/callback}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost:5173}
    command: air -c .air.toml

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    working_dir: /app
    environment:
      - VITE_API_PROXY_TARGET=http://api:8080
    depends_on:
      - api
    command: node node_modules/vite/bin/vite.js --host 0.0.0.0 --clearScreen false
